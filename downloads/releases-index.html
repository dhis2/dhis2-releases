<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DHIS2 Releases</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="landing.css">
  <link rel="stylesheet" href="css/archive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    body { padding: 0; }
    #stable-ver-select { padding: .4rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; background: #fff; appearance: auto; width: auto; margin: 0; }
    .channel-tabs { display: flex; gap: .5rem; margin: 1rem 0 1.25rem; }
    .tab-btn {
      padding: .4rem 1rem; border: 1px solid #ddd; border-radius: 4px;
      background: #f5f7fa; cursor: pointer; font-size: .95rem; font-weight: 500;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab-btn:hover:not(.active) { background: #e8edf5; }
    .channel-panel { display: none; }
    .channel-panel.active { display: block; }
    .panel-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-bottom: 1rem; }
    .panel-controls label { font-size: .9rem; display: flex; align-items: center; gap: .35rem; cursor: pointer; }
    /* override archive.css card-body scroll for this page */
    .card-body.unbounded { max-height: none; overflow-y: visible; }
    .s3-note { font-size: .85rem; color: var(--muted); margin-bottom: .75rem; }
    .badge-rc {
      display: inline-block; background: #e8f4ff; color: #1a5276;
      border: 1px solid #a9cce3; border-radius: 3px;
      padding: .1rem .35rem; font-size: .75rem; font-weight: 600; margin-left: .4rem;
    }
    .badge-symlink {
      display: inline-block; background: #f0f0f0; color: #555;
      border: 1px solid #ccc; border-radius: 3px;
      padding: .1rem .35rem; font-size: .75rem; margin-left: .4rem;
    }
    .mock-banner {
      background: #fff8e1; border: 1px solid #ffe082; border-radius: 4px;
      padding: .5rem .8rem; margin-bottom: 1rem; font-size: .85rem; color: #6d4c00;
    }
    .docker-code {
      font-family: monospace; font-size: .82rem;
      background: #f0f0f0; padding: .1rem .35rem; border-radius: 3px;
    }
    .loading { color: var(--muted); padding: 1rem 0; display: block; }
    /* superseded toggle scoped to this page's mount point */
    #stable-content.show-superseded .superseded-dhis2-dl { display: table-row; }
    /* sortable column indicators */
    thead th.sort-asc::after  { content: ' ▲'; font-size: .75em; opacity: .7; }
    thead th.sort-desc::after { content: ' ▼'; font-size: .75em; opacity: .7; }
    @media (max-width: 700px) {
      .panel-controls { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div id="topBar"></div>
  <img src="dhis2-logo-rgb-positive.png" alt="DHIS2"
       style="position:absolute; top:16px; left:20px; width:150px; z-index:1;">
  <div id="container">
    <h2>DHIS2 Releases</h2>

    <div class="intro">
      <p>
        Here you can find WAR files for recent builds of DHIS2.
        Details of stable releases are also available in <a href="v1/versions/stable.json">JSON form</a>.<br>
        Demo databases are available from <a href="https://databases.dhis2.org">databases.dhis2.org</a>.
      </p>
    </div>

    <div class="channel-tabs" role="tablist">
      <button class="tab-btn active" data-panel="stable" role="tab" aria-selected="true">Stable</button>
      <button class="tab-btn" data-panel="dev" role="tab" aria-selected="false">Development</button>
    </div>

    <!-- Stable panel -->
    <section id="panel-stable" class="channel-panel active" role="tabpanel">
      <div class="panel-controls">
        <label for="stable-ver-select" class="select-label">Version:</label>
        <select id="stable-ver-select" aria-label="Select DHIS2 version"></select>
        <label><input type="checkbox" id="show-superseded-cb"> Show superseded patches</label>
        <label><input type="checkbox" id="show-rc-cb"> Show release candidates (S3 view)</label>
      </div>
      <div id="stable-content"></div>
    </section>

    <!-- Dev panel -->
    <section id="panel-dev" class="channel-panel" role="tabpanel">
      <div id="dev-content"></div>
    </section>
  </div>

  <script src="js/releases-index.js" defer></script>
</body>
</html>
